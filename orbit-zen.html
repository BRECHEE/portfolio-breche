<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08111d"><title>ORBIT — Respire. Saute. Recommence.</title>
<style>
:root{color-scheme:dark;--ink:#e8f6f3;--muted:#94aaa9;--glass:rgba(12,28,39,.56);--line:rgba(220,255,249,.13)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111d;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);border-radius:99px;cursor:pointer;min-width:44px;min-height:44px}button:active{transform:scale(.96)}.hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{font-size:12px;letter-spacing:.32em;font-weight:800;color:#d9fff4}.sub{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:5px}.score{text-align:center;margin-top:2px}.score strong{display:block;font-size:clamp(34px,8vw,48px);font-weight:300;letter-spacing:-.06em;line-height:1}.score span{font-size:9px;letter-spacing:.22em;color:var(--muted)}.actions{pointer-events:auto;display:flex;gap:8px}.actions button{width:44px;height:44px;font-size:16px}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.hint{font-size:11px;color:#bdd0cc;letter-spacing:.04em;line-height:1.6}.hint b{color:#effffb;font-weight:600}.world{font-size:10px;letter-spacing:.17em;color:#c9e8df;text-align:right}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,rgba(5,14,23,.15),rgba(5,14,23,.56));transition:opacity .35s;pointer-events:auto}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(340px,100%);text-align:center;padding:34px 25px 28px;border:1px solid var(--line);border-radius:28px;background:rgba(8,21,31,.68);backdrop-filter:blur(18px);box-shadow:0 24px 100px #02080d55}.eyebrow{font-size:9px;letter-spacing:.3em;color:#a5c8bf}.card h1{font-size:clamp(36px,11vw,53px);font-weight:300;letter-spacing:-.08em;margin:12px 0 4px}.card h1 em{font-style:normal;color:#9af4dc}.card p{font-size:12px;line-height:1.8;color:#a8c0bb;margin:12px 0 24px}.play{width:100%;border:0;background:#c4f7e8;color:#08201e;font-size:11px;letter-spacing:.19em;font-weight:800;padding:0 20px;height:52px}.mini{font-size:10px;color:#8da8a3;margin-top:16px}.skins{display:flex;justify-content:center;gap:9px;margin-top:19px}.skin{width:31px;height:31px;min-width:31px;min-height:31px;border-radius:50%;position:relative;background:var(--c);opacity:.45}.skin.active{opacity:1;box-shadow:0 0 0 2px #eafff9,0 0 20px var(--c)}.skin.locked:after{content:"·";position:absolute;inset:0;display:grid;place-items:center;color:#152b2b;font-weight:900;font-size:20px}.hide{display:none!important}@media(min-width:700px){.hud{padding:28px 34px}.bottom{padding-bottom:8px}.hint{font-size:12px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Jeu Orbit"></canvas>
<div class="hud"><div class="top"><div><div class="brand">O R B I T</div><div class="sub">UN TAP. UN INSTANT.</div></div><div class="score"><strong id="score">0</strong><span>ORBES ATTEINTES</span></div><div class="actions"><button id="mute" aria-label="Activer ou couper le son">♫</button><button id="pause" aria-label="Pause">Ⅱ</button></div></div><div class="bottom"><div class="hint"><b>Touche pour bondir</b><br>Observe le rythme. Trouve l'ouverture.</div><div class="world" id="world">MONDE I · NOCTURNE</div></div></div>
<div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">UNE PETITE ÉVASION</div><h1 id="title">OR<em>BIT</em></h1><p id="message">Un souffle, un cercle, un nouveau départ.<br>Saute au bon moment pour continuer ton voyage.</p><button class="play" id="start">COMMENCER LE VOYAGE</button><div class="skins" id="skins"></div><div class="mini" id="best">MEILLEUR SCORE · 0</div></div></div>
<script>
(()=>{
'use strict';
// ORBIT : tout le jeu, les effets et la musique sont dessinés/générés localement.
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
const worlds=[
 {name:'MONDE I · NOCTURNE',bg:['#08111f','#182d46','#0b1928'],ring:'#9edbd1',glow:'#8ef5e0',star:'#d7fff5'},
 {name:'MONDE II · OCÉAN',bg:['#061b29','#0c4554','#082633'],ring:'#9fe7e8',glow:'#8affee',star:'#c8fffa'},
 {name:'MONDE III · FORÊT',bg:['#0b1d1a','#234638','#0d2823'],ring:'#b6e4b4',glow:'#c7ffad',star:'#e2ffd2'}
];
const skinData=[{name:'Lueur',color:'#baffec',unlock:0},{name:'Aurore',color:'#ffcc91',unlock:10},{name:'Cosmos',color:'#d3b7ff',unlock:25},{name:'Esprit',color:'#ff9fc8',unlock:50}];
let W=0,H=0,DPR=1,now=0,last=0,elapsed=0,state='menu',score=0,best=+(sessionStorage.getItem('orbitBest')||0),skin=0,muted=false;
let player={x:0,y:0,angle:-Math.PI/2,r:58,orbit:0,mode:'orbit',vx:0,vy:0};
let rings=[],particles=[],stars=[],cameraY=0,targetCam=0,shake=0,flash=0;
let audio=null,master=null,musicTimer=null,musicStep=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.floor(W*H/6000)},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.3,1),p:rand(0,6)}));if(!rings.length)resetGame(false)}
addEventListener('resize',resize);
function worldIndex(n){return Math.floor(Math.max(0,n)/10)%3}
function world(){return worlds[worldIndex(score)]}
function makeRing(x,y,index){const r={x,y,rad:rand(32,43),angle:rand(0,Math.PI*2),speed:(.72+Math.min(index*.035,1.5))*(Math.random()<.5?-1:1),monsters:[],index};const count=Math.min(1+Math.floor(index/4),3);for(let i=0;i<count;i++)r.monsters.push({a:rand(0,Math.PI*2),speed:r.speed*rand(.7,1.45),r:rand(5,7)});return r}
function resetGame(start=true){score=0;elapsed=0;cameraY=targetCam=0;shake=flash=0;particles=[];rings=[];player={x:W*.5,y:H*.58,angle:-Math.PI/2,r:Math.max(42,Math.min(60,W*.14)),orbit:0,mode:'orbit',vx:0,vy:0};rings.push(makeRing(W*.5,H*.58,0));rings.push(makeRing(W*.5+rand(-W*.19,W*.19),H*.58-rand(135,175),1));rings.push(makeRing(W*.5+rand(-W*.2,W*.2),H*.58-rand(285,335),2));player.angle=-Math.PI/2;syncUI();if(start)state='playing'}
function syncUI(){$('score').textContent=score;$('best').textContent='MEILLEUR SCORE · '+best;$('world').textContent=world().name;drawSkins()}
function drawSkins(){const box=$('skins');box.innerHTML='';skinData.forEach((s,i)=>{const b=document.createElement('button');b.className='skin'+(i===skin?' active':'')+(best<s.unlock?' locked':'');b.style.setProperty('--c',s.color);b.title=best<s.unlock?'Débloqué à '+s.unlock+' cercles':s.name;b.setAttribute('aria-label',b.title);b.onclick=e=>{e.stopPropagation();if(best>=s.unlock){skin=i;drawSkins()}};box.appendChild(b)})}
function initAudio(){if(audio){audio.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=muted?0:.22;master.connect(audio.destination);musicLoop()}
function tone(freq,duration,volume,type='sine',when=0){if(!audio||muted)return;const t=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(master);o.start(t);o.stop(t+duration+.03)}
function musicLoop(){if(!audio)return;const chords=[[174.61,220,261.63],[146.83,196,246.94],[164.81,207.65,246.94],[130.81,164.81,196]];const play=()=>{if(!audio||audio.state==='closed')return;const chord=chords[musicStep%chords.length];chord.forEach((f,i)=>tone(f,3.5,.027,'sine',i*.11));tone(chord[0]*2,2,.012,'sine',.45);musicStep++;musicTimer=setTimeout(play,3200)};play()}
function successSound(){tone(523.25,.55,.12);tone(659.25,.7,.08,'sine',.07);tone(783.99,.9,.045,'sine',.15)}
function burst(x,y,color,n=15){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(25,150);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.35,.85),max:.85,size:rand(1,3),color})}}
function activeRing(){return rings[score]||rings[rings.length-1]}
function jump(){if(state==='menu'||state==='over'){startGame();return}if(state!=='playing')return;if(player.mode!=='orbit')return;const r=activeRing();if(!r)return;player.x=r.x+Math.cos(player.angle)*player.r;player.y=r.y+Math.sin(player.angle)*player.r;const next=rings[score+1];if(!next)return;const dx=next.x-player.x,dy=next.y-player.y,len=Math.hypot(dx,dy)||1;player.vx=dx/len*(Math.max(470,H*.78));player.vy=dy/len*(Math.max(470,H*.78));player.mode='fly';burst(player.x,player.y,skinData[skin].color,7)}
function startGame(){initAudio();resetGame(true);$('overlay').classList.add('hidden');last=performance.now()}
function endGame(){if(state!=='playing')return;state='over';shake=9;flash=.45;burst(player.x,player.y,'#ffffff',35);if(score>best){best=score;sessionStorage.setItem('orbitBest',best)}syncUI();$('eyebrow').textContent='LE VOYAGE CONTINUE';$('title').innerHTML='ENCORE<em>…</em>';$('message').innerHTML='Tu as atteint <b>'+score+'</b> cercle'+(score===1?'':'s')+'.<br>Le silence attend ton prochain saut.';$('start').textContent='RECOMMENCER';$('overlay').classList.remove('hidden')}
function addNext(){const lastRing=rings[rings.length-1],i=rings.length;const gap=clamp(H*.27+score*2.1,135,H*.42);const x=clamp(lastRing.x+rand(-W*.27,W*.27),W*.17,W*.83);rings.push(makeRing(x,lastRing.y-gap,i))}
function update(dt){if(state!=='playing'){updateParticles(dt);return}elapsed+=dt;const r=activeRing();if(player.mode==='orbit'&&r){player.angle+=r.speed*dt;player.x=r.x+Math.cos(player.angle)*player.r;player.y=r.y+Math.sin(player.angle)*player.r}
if(player.mode==='fly'){player.x+=player.vx*dt;player.y+=player.vy*dt;const next=rings[score+1];if(next){const d=Math.hypot(player.x-next.x,player.y-next.y);if(d<next.rad+9){const col=world().glow;player.mode='orbit';player.r=next.rad;player.angle=Math.atan2(player.y-next.y,player.x-next.x);score++;successSound();burst(player.x,player.y,col,22);if(score%10===0){flash=.24;burst(player.x,player.y,worlds[worldIndex(score)].glow,36)}if(score+3>=rings.length)addNext();syncUI();}else if(player.x<-30||player.x>W+30||player.y<-cameraY-100||player.y>H+cameraY+100||d>Math.max(W,H)*1.5){endGame()}}}
const check=rings[Math.min(score,rings.length-1)];if(player.mode==='orbit'&&check){for(const m of check.monsters){m.a+=m.speed*dt;const mx=check.x+Math.cos(m.a)*check.rad,my=check.y+Math.sin(m.a)*check.rad;if(Math.hypot(player.x-mx,player.y-my)<m.r+5){endGame();break}}}
targetCam=player.y-H*.53;cameraY+=(targetCam-cameraY)*(1-Math.exp(-dt*3.2));for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.12,dt);p.vy*=Math.pow(.12,dt);p.life-=dt}particles=particles.filter(p=>p.life>0);shake*=Math.pow(.03,dt);flash=Math.max(0,flash-dt)}
function drawBackground(){const w=world();const g=ctx.createLinearGradient(0,0,0,H);w.bg.forEach((c,i)=>g.addColorStop(i/2,c));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const t=elapsed;for(const s of stars){let y=(s.y+t*7*s.z)%H;ctx.globalAlpha=.2+s.z*.5;ctx.fillStyle=w.star;ctx.beginPath();ctx.arc(s.x,y,Math.max(.5,s.z*1.2),0,Math.PI*2);ctx.fill();if(s.z>.8){ctx.globalAlpha*=.25+.25*Math.sin(t*2+s.p);ctx.fillRect(s.x-3,y,6,.6)}}ctx.globalAlpha=1;const glow=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,Math.max(W,H)*.7);glow.addColorStop(0,w.glow+'12');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H)}
function drawRing(r){const y=r.y-cameraY;if(y<-120||y>H+120)return;const w=world();ctx.save();ctx.translate(r.x,y);ctx.shadowBlur=22;ctx.shadowColor=w.glow;ctx.strokeStyle=w.ring;ctx.globalAlpha=.16;ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,0,r.rad,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.8;ctx.shadowBlur=10;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,r.rad,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.28;ctx.setLineDash([2,8]);ctx.beginPath();ctx.arc(0,0,r.rad+10,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;
for(const m of r.monsters){const x=Math.cos(m.a)*r.rad,y2=Math.sin(m.a)*r.rad;ctx.fillStyle='#ffb4ad';ctx.shadowBlur=13;ctx.shadowColor='#ff837d';ctx.beginPath();ctx.arc(x,y2,m.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#422a3b';ctx.beginPath();ctx.arc(x-2,y2-1,1.2,0,Math.PI*2);ctx.arc(x+2,y2-1,1.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawPlayer(){const x=player.x,y=player.y-cameraY,c=skinData[skin].color;ctx.save();ctx.globalAlpha=.2;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowColor=c;ctx.shadowBlur=24;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,5.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(x-1.3,y-1.4,1.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y-cameraY,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function frame(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);drawBackground();ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));for(const r of rings)drawRing(r);drawParticles();if(state==='playing'||state==='over')drawPlayer();ctx.restore();if(flash>0){ctx.fillStyle='rgba(220,255,244,'+Math.min(.25,flash)+')';ctx.fillRect(0,0,W,H)}requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{if(e.target===canvas)jump()});$('start').addEventListener('click',startGame);$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'♪̸':'♫';if(master)master.gain.setTargetAtTime(muted?0:.22,audio.currentTime,.08);if(!muted)initAudio()});$('pause').addEventListener('click',()=>{if(state==='playing'){state='paused';$('eyebrow').textContent='PRENDS TON TEMPS';$('title').innerHTML='PAU<em>SE</em>';$('message').textContent='Le monde attend. Reprends quand tu es prêt.';$('start').textContent='REPRENDRE';$('overlay').classList.remove('hidden')}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');last=performance.now()}else if(state==='menu')startGame()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){$('pause').click()}});
resize();syncUI();last=performance.now();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
